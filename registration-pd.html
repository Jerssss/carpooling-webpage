<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Role Registration | Carpool</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registration-pd.css">
</head>
<body data-role="both">

    <!-- NAVBAR -->
    <nav>
        <div class="nav-left">
            <img src="images/carma-logo.png" class="logo" alt="Carma Logo">
            <span class="site-name">CARMA</span>
        </div>
        <div class="nav-right"></div>
    </nav>

    <div class="form-container">
        <h1>Multi Role Registration</h1>

        <form class="registration-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="text" id="contact" name="contact" placeholder="Enter contact number" required>
            </div>

            <div class="form-group">
                <label for="occupation">Occupation</label>
                <input type="text" id="occupation" name="occupation" placeholder="Enter occupation" required>
            </div>

            <!-- File Uploads above password -->
            <div class="form-group">
                <label>Upload Documents</label>
                <div class="file-upload-big">
                    <input type="file" id="license" name="license" accept="image/*" required>
                    <span><img src="../9467_it312-teamarc_midtermproject/images/uploadimage.png" alt="Upload Icon"> Upload Driver's License</span>
                </div>
                <div class="file-upload-big">
                    <input type="file" id="vehicle-reg" name="vehicle-reg" accept="image/*" required>
                    <span><img src="../9467_it312-teamarc_midtermproject/images/uploadimage.png" alt="Upload Icon"> Upload Vehicle Registration</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password used for driver and passenger" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

    <script src="register.js" defer></script>

</body>
</html>
