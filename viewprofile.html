<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POOLCAR | Driver Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viewprofile.css">
    <link rel="stylesheet" href="css/notifications.css">
    <script src="js/script.js" defer></script>
    <script src="js/notifications.js" defer></script>
  </head>
  <body>
    <!-- ===== NAVBAR ===== -->
      <nav>
    <!-- Left side nav -->
    <div class="nav-left">
      <img src="images/carma-logo.png" class="logo" alt="Drop N Go Logo">
      <span class="site-name">CARMA</span>
    </div>

    <!-- Center navigation links -->
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a class="active" href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

    <!-- Right side nav -->
    <div class="nav-right">
      <!-- Hamburger Menu -->
      <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="nav-bell">
        <img src="images/bell.png" class="bell-icon" onclick="toggleNotifications()">
        <div id="notificationsContainer">
          <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notif-tabs">
              <span class="active" id="allTab">All</span>
              <span id="unreadTab">Unread</span>
            </div>
            <div class="notif-list" id="notifList">
              <div class="notif-item">
                <div class="notif-content">
                  <p>Loading notifications...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <img src="images/speed.jpg" class="user-pic" onclick="toggleMenu()">
    </div>

    <!-- Profile dropdown -->
    <div class="sub-menu-wrap" id="subMenu">
      <div class="sub-menu">
        <div class="user-info">
          <img src="images/speed.jpg">
          <h2 id="userName">Loading...</h2>
        </div>
        <hr>
        <a href="profile.html" class="sub-menu-link">
          <img src="images/user.png" alt="usericon">
          <p>Edit Profile</p>
          <span>></span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="images/settings.png" alt="settings">
          <p>Settings</p>
          <span>></span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="images/question.png" alt="helpsicon">
          <p>Help & Support</p>
          <span>></span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="images/user-logout.png" alt="userlogouticon">
          <p>Logout</p>
          <span>></span>
        </a>
      </div>
    </div>
  </nav>

    <!-- ===== DRIVER PROFILE SECTION ===== -->
    <section class="profile-page">


      <div id="driverProfile">
        <p>Loading driver profile...</p>
      </div>
    </section>

    <!-- ===== FOOTER SECTION ===== -->
    <footer class="site-footer">
      <div class="social-icons">
        <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
        <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="images/google.png" alt="Google"></a>
        <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
      </div>

      <ul class="footer-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="news.html">Rides</a></li>
        <li><a href="about.html">History</a></li>
        <li><a href="team.html">Our Team</a></li>
      </ul>

      <p class="footer-copy">Copyright ©2025 | Designed by <span>Bos Badet</span></p>
    </footer>

    <!-- Include driverprofile.js last so it can populate the profile -->
    <script src="js/driverprofile.js"></script>
  </body>
</html>
