<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POOLCAR | Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <img src="logo.png" class="logo" alt="POOLCAR Logo">
    <ul>
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="#">Ride</a></li>
      <li><a href="#">History</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
    <img src="images/speed.jpg" class="user-pic" alt="User Icon">
  </nav>

  <section class="profile-page">
    <div class="profile-container">
      <div class="profile-header">
        <div class="user-basic">
          <img src="images/speed.jpg" alt="Profile Picture" class="profile-photo">
          <div>
            <h2>Jorge Terre</h2>
            <p>jeremiah@gmail.com</p>
          </div>
        </div>
        <button class="edit-btn">Edit</button>
      </div>

      <form class="profile-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label>Nickname</label>
          <input type="text" placeholder="Enter nickname">
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" placeholder="Enter contact number">
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" placeholder="Enter alternate number">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <input type="text" placeholder="Enter gender">
        </div>

        <div class="form-group">
          <label>Role (Teacher/Student)</label>
          <input type="text" placeholder="Enter role">
        </div>
      </form>
    </div>
  </section>
</body>
</html>
