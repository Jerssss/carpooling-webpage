<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POOLCAR | Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <nav>
      <img src="logo.png" class="logo">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rides.html">Rides</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="about.html">About Us</a></li>
      </ul>
      <img src="images/speed.jpg" class="user-pic" onclick="toggleMenu()">
      <div class="sub-menu-wrap" id="subMenu">
        <div class="sub-menu">
          <div class="user-info">
            <img src="/images/speed.jpg">
            <h2>Darren Watkins</h2>
          </div>
          <hr>
          <a href="#" class="sub-menu-link">
            <img src="images/user.png" alt="usericon">
            <p>Edit Profile</p>
            <span>></span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="images/settings.png" alt="settings">
            <p>Settings</p>
            <span>></span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="images/question.png" alt="helpsicon">
            <p>Help & Support</p>
            <span>></span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="images/user-logout.png" alt="userlogouticon">
            <p>Logout</p>
            <span>></span>
          </a>
        </div>
      </div>
    </nav>

    <section class="profile-page">
      <div class="profile-container">
        <div class="profile-header">
          <div class="user-basic">
            <img src="images/speed.jpg" alt="Profile Picture" class="profile-photo">
            <div>
              <h2>Jorge Terre</h2>
              <p>jeremiah@gmail.com</p>
            </div>
          </div>
          <button class="edit-btn">Edit</button>
        </div>

        <form class="profile-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter full name">
          </div>

          <div class="form-group">
            <label>Nickname</label>
            <input type="text" placeholder="Enter nickname">
          </div>

          <div class="form-group">
            <label>Contact Number</label>
            <input type="text" placeholder="Enter contact number">
          </div>

          <div class="form-group">
            <label>Contact Number</label>
            <input type="text" placeholder="Enter alternate number">
          </div>

          <div class="form-group">
            <label>Gender</label>
            <input type="text" placeholder="Enter gender">
          </div>

          <div class="form-group">
            <label>Role (Teacher/Student)</label>
            <input type="text" placeholder="Enter role">
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
