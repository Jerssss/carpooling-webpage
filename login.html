<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Carpool</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-left">
            <img src="images/carma-logo.png" class="logo" alt="Carma Logo">
            <span class="site-name">CARMA</span>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- PAGE WRAPPER -->
    <div class="page-wrapper">
        <div class="background-shape"></div>

        <!-- LOGIN FORM -->
        <div class="login-container">
            <h2>Login</h2>
                <form id="loginForm" method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="email" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select name="role" id="role" required>
                        <option value="passenger">Passenger</option>
                        <option value="driver">Driver</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <p class="signup-text">
                    Don't have an account? <a href="#" id="register-link">Register</a>
                </p>
            </form>
                    <button type="submit">Login</button>
            </form>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="register-modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h3>Register as</h3>
            <div class="modal-buttons">
                <button class="modal-option" id="driver-btn">Driver</button>
                <button class="modal-option" id="passenger-btn">Passenger</button>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER SECTION ===== -->
    <footer class="site-footer">
        <div class="social-icons">
            <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="#"><img src="images/google.png" alt="Google"></a>
            <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
        </div>

        <ul class="footer-nav">
            <li><a href="passenger-side/index.html">Home</a></li>
            <li><a href="passenger-side/list-of-carpools.html">Rides</a></li>
            <li><a href="passenger-side/history.html">History</a></li>
            <li><a href="passenger-side/about.html">Our Team</a></li>
        </ul>
        <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
    </footer>

  <!-- Add the login JS -->
<script src="admin-side/nodejs/login.js"></script>

</body>
</html>
