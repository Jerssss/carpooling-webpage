<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Feedbacks</title>
    <link rel="stylesheet" href="css/driver-style.css">
    <link rel="stylesheet" href="css/driver-feedbacks.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <script src="js/driver-script.js" defer></script>
</head>
<body>
    <!-- NAVBAR -->
<nav>
      <!-- Left -->
      <div class="nav-left">
        <img src="../images/carma-logo.png" class="logo" alt="CARMA Logo">
        <span class="site-name">CARMA</span>
      </div>

      <!-- Center Links -->
      <ul>
        <li><a href="driver-landing.html">Home</a></li>
        <li><a href="driver-history.html">History</a></li>
      </ul>

      <!-- Right -->
      <div class="nav-right">
        <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
          <div></div>
          <div></div>
          <div></div>
        </div>

        <div class="nav-bell">
          <img src="../images/bell.png" class="bell-icon" onclick="toggleNotifications()">

          <div id="notificationsContainer">
            <div class="notifications-dropdown" id="notificationsDropdown">
              <div class="notif-tabs">
                <span class="active" id="allTab">All</span>
                <span id="unreadTab">Unread</span>
              </div>
              <div class="notif-list" id="notifList">
                <div class="notif-item">
                  <div class="notif-content">
                    <p>Loading notifications...</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <img src="../images/speed.jpg" class="user-pic" onclick="toggleMenu()">
      </div>

      <!-- Dropdown -->
      <div class="sub-menu-wrap" id="subMenu">
        <div class="sub-menu">
          <div class="user-info">
            <img src="../images/speed.jpg" alt="User">
            <h2 id="userName">Loading...</h2>
          </div>
          <hr>
          <a href="driver-profile.html" class="sub-menu-link">
            <img src="../images/user.png">
            <p>Driver Profile</p>
            <span>&gt;</span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="../images/settings.png">
            <p>Settings</p>
            <span>&gt;</span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="../images/question.png">
            <p>Help & Support</p>
            <span>&gt;</span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="../images/user-logout.png">
            <p>Logout</p>
            <span>&gt;</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
        <!-- History (Left Panel) -->
        <div class="history-section">
            <h2>History</h2>
            <!-- Cards will be inserted dynamically by JS -->
        </div>

        <!-- Feedback Details (Right Panel) -->
        <div class="feedback-section">
            <!-- JS will inject -->
            <h2 id="feedback-date"></h2>
        </div>
    </div>

    <!-- MODAL -->
    <div id="feedback-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modal-name">Passenger Name</h3>
            <p id="modal-feedback">Feedback description here...</p>
            <div id="modal-rating">Rating: ★★★★☆</div>
        </div>
    </div>

    <!-- External JS (Dynamic Injection + Modal Logic) -->
        <script src="js/driver-feedbacks.js"></script>
        <script>
            function toggleDriverNotifications() {
                const dd = document.getElementById('notificationsDropdown');
                if (dd) dd.classList.toggle('show');
            }
            document.addEventListener('click', (e) => {
                const inside = e.target.closest('.nav-bell');
                const dd = document.getElementById('notificationsDropdown');
                if (dd && !inside) dd.classList.remove('show');
            });
        </script>
        <script src="../passenger-side/js/notifications.js" defer></script>

    <!-- ===== FOOTER SECTION ===== -->
    <footer class="site-footer">
    <div class="social-icons">
        <a href="#"><img src="../images/facebook-app-symbol.png" alt="Facebook"></a>
        <a href="#"><img src="../images/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="../images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="../images/google.png" alt="Google"></a>
        <a href="#"><img src="../images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
        <li><a href="driver-landing.html">Home</a></li>
        <li><a href="driver-schedule-carpool.html">Schedule</a></li>
        <li><a href="driver-history.html">Feedbacks</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
</footer>
</body>
</html>
