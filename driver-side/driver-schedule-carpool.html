<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Carpool - Carma</title>
    <link rel="stylesheet" href="css/driver-style.css">
    <link rel="stylesheet" href="css/driver-schedule-carpool.css">
        <style>
            .input-with-icon { display: flex; align-items: center; gap: 8px; }
            .input-with-icon img { width: 24px; height: 24px; cursor: pointer; }
            /* Simple modal for map */
            .map-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
            .map-modal.open { display: flex; }
            .map-card { background: #fff; width: 90%; max-width: 800px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); overflow: hidden; }
            .map-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; }
            .map-body { height: 450px; }
            #map { width: 100%; height: 100%; }
            .map-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #eee; }
            .btn { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; }
            .btn.primary { background: #ffb300; color: #fff; }
            .btn.secondary { background: #e9e9e9; }
        </style>

</head>
<body>
    <!-- NAVBAR -->
    <nav>
        <div class="nav-left">
            <img src="../images/carma-logo.png" class="logo" />
            <span class="site-name">Carma</span>
        </div>
        <ul>
            <li><a href="../driver-side/driver-landing.html">Home</a></li>
            <li><a href="../driver-side/driver-schedule-carpool.html" class="active">Schedule</a></li>
            <li><a href="../driver-side/driver-feedbacks.html">Feedbacks</a></li>
        </ul>
        <div class="nav-right">
            <div id="notificationsContainer" class="nav-bell">
                <img src="../images/bell.png" class="bell-icon" />
            </div>
            <img src="../images/bod.jpg" class="user-pic" />
        </div>
    </nav>

    <!-- FORM SECTION -->
    <div class="form-container">
        <h1>Schedule a Carpool</h1>
        <form>
            <div class="form-group">
                <label for="start-location">Starting Location</label>
                <input type="text" id="start-location" name="start-location" placeholder="Enter your location" required>
            </div>

                        <div class="form-group">
                                <label for="destination">Destination</label>
                                <div class="input-with-icon">
                                    <input type="text" id="destination" name="destination" placeholder="Enter destination" required autocomplete="off">
                                    <img id="openMapPicker" src="../images/location.png" alt="Pick on map" title="Pick on map">
                                </div>
                                <input type="hidden" id="dest-lat" name="dest-lat">
                                <input type="hidden" id="dest-lng" name="dest-lng">
                            </div>

            <div class="form-group">
                <label for="seats">Available Seats</label>
                <input type="number" id="seats" name="seats" min="1" placeholder="Number of seats available" required>
            </div>

            <div class="form-group">
                <label for="cost">Cost per Seat (₱)</label>
                <input type="number" id="cost" name="cost" min="0" step="0.01" placeholder="Price per seat" required>
            </div>

            <div class="form-group">
                <label for="departure">Departure Time</label>
                <input type="datetime-local" id="departure" name="departure" required>
            </div>

            <button type="submit" class="submit-btn">Create Carpool</button>
        </form>
    </div>

        <!-- Map Picker Modal -->
        <div id="mapModal" class="map-modal" aria-hidden="true">
            <div class="map-card" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
                <div class="map-header">
                    <h3 id="mapTitle">Pick Destination</h3>
                    <button type="button" class="btn secondary" id="closeMapPicker">Close</button>
                </div>
                <div class="map-body"><div id="map"></div></div>
                <div class="map-actions">
                    <button type="button" class="btn secondary" id="resetMarker">Reset</button>
                    <button type="button" class="btn primary" id="useLocation">Use This Location</button>
                </div>
            </div>
        </div>

    <!-- ===== FOOTER SECTION ===== -->
    <footer class="site-footer">
      <div class="social-icons">
        <a href="#"><img src="../images/facebook-app-symbol.png" alt="Facebook"></a>
        <a href="#"><img src="../images/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="../images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="../images/google.png" alt="Google"></a>
        <a href="#"><img src="../images/youtube.png" alt="YouTube"></a>
      </div>

            <ul class="footer-nav">
              <li><a href="../driver-side/driver-landing.html">Home</a></li>
              <li><a href="../driver-side/driver-schedule-carpool.html">Schedule</a></li>
              <li><a href="#">Feedbacks</a></li>
              <li><a href="../passenger-side/about.html">Our Team</a></li>
            </ul>

      <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
    </footer>

        <script src="js/driver-schedule-carpool.js"></script>
</body>
</html>
