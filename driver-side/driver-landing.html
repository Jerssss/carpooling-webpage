<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Landing</title>
    <link rel="stylesheet" href="css/driver-style.css">
    <link rel="stylesheet" href="css/driver-landing.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <script src="js/driver-script.js" defer></script>
    <script src="../js/notifications.js" defer></script>
    <script src="../js/notifications-loader.js" defer></script>
</head>

<body>

<!-- NAVBAR -->
<nav>
      <!-- Left -->
      <div class="nav-left">
        <img src="../images/carma-logo.png" class="logo" alt="CARMA Logo">
        <span class="site-name">CARMA</span>
      </div>

      <!-- Center Links -->
      <ul>
        <li><a href="driver-landing.html">Home</a></li>
        <li><a href="driver-history.html">History</a></li>
        <li><a href="driver-management.html">Manage</a></li>
      </ul>

      <!-- Right -->
      <div class="nav-right">
        <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
          <div></div>
          <div></div>
          <div></div>
        </div>

        <div class="nav-bell">
          <img src="../images/bell.png" class="bell-icon" alt="Notifications">
          <div id="notificationsContainer"></div>
        </div>

        <img src="../images/speed.jpg" class="user-pic" onclick="toggleMenu()">
      </div>

      <!-- Dropdown -->
      <div class="sub-menu-wrap" id="subMenu">
        <div class="sub-menu">
          <div class="user-info">
            <img src="../images/speed.jpg" alt="User">
            <h2 id="userName">Loading...</h2>
          </div>
          <hr>
          <a href="driver-profile.html" class="sub-menu-link">
            <img src="../images/user.png">
            <p>Driver Profile</p>
            <span>&gt;</span>
          </a>
          <a href="#" class="sub-menu-link">
            <img src="../images/user-logout.png">
            <p>Logout</p>
            <span>&gt;</span>
          </a>
        </div>
      </div>
    </nav>

<div class="driver-container">

    <!-- LEFT SIDEBAR -->
    <div class="left-panel">
        <h2>Welcome!</h2>
        <h3>Scheduled Carpool</h3>

        <div class="schedule-list"></div>

        <a href="../driver-side/driver-schedule-carpool.html" class="schedule-btn fixed-bottom-btn">
            Schedule a Carpool
        </a>
    </div>

    <!-- RIGHT CONTENT WINDOW -->
    <div class="right-panel"></div>
</div>

<!-- Shared Map Modal -->
<div id="locMapModal" class="map-modal" aria-hidden="true">
    <div class="map-card" role="dialog" aria-modal="true" aria-labelledby="locMapTitle">
        <div class="map-header">
            <h3 id="locMapTitle">Location</h3>
            <button type="button" class="btn secondary" id="closeLocMap">Close</button>
        </div>
        <div class="map-body">
            <div id="locMap"></div>
        </div>
    </div>
    <div class="map-backdrop" aria-hidden="true"></div>
    <div class="sr-only" id="locMapStatus" aria-live="polite"></div>
    <div id="locMapToast" class="map-toast" aria-hidden="true"></div>
</div>

<script src="../location-map.js" defer></script>

<script>
    function toggleDriverNotifications() {
        const dd = document.getElementById('notificationsDropdown');
        if (dd) dd.classList.toggle('show');
    }

    document.addEventListener('click', (e) => {
        const inside = e.target.closest('.nav-bell');
        const dd = document.getElementById('notificationsDropdown');
        if (dd && !inside) dd.classList.remove('show');
    });
</script>

<script src="../passenger-side/js/notifications.js" defer></script>

<footer class="site-footer">
    <div class="social-icons">
        <a href="#"><img src="../images/facebook-app-symbol.png" alt="Facebook"></a>
        <a href="#"><img src="../images/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="../images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="../images/google.png" alt="Google"></a>
        <a href="#"><img src="../images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
        <li><a href="driver-landing.html">Home</a></li>
        <li><a href="driver-schedule-carpool.html">Schedule</a></li>
        <li><a href="driver-history.html">Feedbacks</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
</footer>

<script src="js/driver-landing.js"></script>
</body>
</html>
