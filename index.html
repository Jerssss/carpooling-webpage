<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>POOLCAR</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="hero">
            <video autoplay muted loop playsinline id="bg-video">
                <source src="videos/r1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <nav>
                <img src="logo.png" class="logo">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Ride</a></li>
                    <li><a href="#">History</a></li>
                    <li><a href="#">About us</a></li>
                </ul>
                <img src="images/speed.jpg" class="user-pic" onclick="toggleMenu()">
                <div class="sub-menu-wrap" id="subMenu">
                    <div class="sub-menu">
                        <div class="user-info">
                            <img src="/images/speed.jpg">
                            <h2>Darren Watkins</h2>
                        </div>
                        <hr>
                        <a href="#" class="sub-menu-link">
                            <img src="images/user.png" alt="usericon">
                            <p>Edit Profile</p>
                            <span>></span>
                        </a>
                        <a href="#" class="sub-menu-link">
                            <img src="images/settings.png" alt="settings">
                            <p>Settings</p>
                            <span>></span>
                        </a>
                        <a href="#" class="sub-menu-link">
                            <img src="images/question.png" alt="helpsicon">
                            <p>Help & Support</p>
                            <span>></span>
                        </a>
                        <a href="#" class="sub-menu-link">
                            <img src="images/user-logout.png" alt="userlogouticon">
                            <p>Logout</p>
                            <span>></span>
                        </a>
                    </div>
                </div>
            </nav>

            <header>
                <div class="left">
                    <h1>Hitchhiking to School Made Easier</h1>
                    <p class="sub-heading">
                        With our partnered drivers, you can get to your destination safe and fast.
                    </p>
                    <div class="buttons">
                        <a href="#" class="btn">Ride Now</a>
                    </div>
                </div>
            </header>
        </div>
    </body>
</html>
