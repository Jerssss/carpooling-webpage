<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARMA | History</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/notifications.css">
  <script src="js/script.js" defer></script>
  <script src="js/notifications.js" defer></script>
</head>

<body>
  <nav>
    <!-- Left side nav -->
    <div class="nav-left">
      <img src="images/sample-pfp.png" class="logo" alt="Drop N Go Logo">
      <span class="site-name">CARMA</span>
    </div>

    <!-- Center navigation links -->
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a class="active" href="history.html">History</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

        <!-- Right side nav -->
        <div class="nav-right">
          <div class="nav-bell">
            <img src="images/bell.png" class="bell-icon" alt="Notifications" onclick="toggleNotifications()">
            <div id="notificationsContainer">
              <div class="notifications-dropdown" id="notificationsDropdown">
                <div class="notif-tabs">
                  <span class="active" id="allTab">All</span>
                  <span id="unreadTab">Unread</span>
                </div>
                <div class="notif-list" id="notifList">
                  <div class="notif-item">
                    <div class="notif-content">
                      <p>Loading notifications...</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <img src="images/speed.jpg" class="user-pic" alt="User" onclick="toggleMenu()">
        </div>

        <!-- Profile dropdown -->
        <div class="sub-menu-wrap" id="subMenu">
          <div class="sub-menu">
            <div class="user-info">
              <img src="images/speed.jpg" alt="User">
              <h2>Darren Watkins</h2>
            </div>
            <hr>
            <a href="profile.html" class="sub-menu-link">
              <img src="images/user.png" alt="usericon">
              <p>Edit Profile</p>
              <span>&gt;</span>
            </a>
            <a href="#" class="sub-menu-link">
              <img src="images/settings.png" alt="settings">
              <p>Settings</p>
              <span>&gt;</span>
            </a>
            <a href="#" class="sub-menu-link">
              <img src="images/question.png" alt="helpsicon">
              <p>Help &amp; Support</p>
              <span>&gt;</span>
            </a>
            <a href="#" class="sub-menu-link">
              <img src="images/user-logout.png" alt="userlogouticon">
              <p>Logout</p>
              <span>&gt;</span>
            </a>
          </div>
        </div>
      </nav>

    <main>

      <section class="search-bar">
        <form>
          <div class="search-container">
            <input type="text" placeholder="Search for rides">
            <button type="submit">
              <img src="images/search-icon.png" alt="Search">
            </button>
          </div>
          <button id="filter" type="button">
            <img src="images/filter-icon.png" alt="Filter">
          </button>
        </form>
      </section>


    <section class="booked-rides">
      <!-- This is where ride cards will be dynamically inserted -->
      <div id="rideHistoryContainer"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="social-icons">
      <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="images/google.png" alt="Google"></a>
      <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="news.html">Rides</a></li>
      <li><a href="about.html">History</a></li>
      <li><a href="team.html">Our Team</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Bos Badet</span></p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("rideHistoryContainer");

      fetch("includes/fetch_history.php")
        .then((response) => response.json())
        .then((data) => {
          container.innerHTML = "";

          if (!data || data.length === 0) {
            container.innerHTML = "<p>No history records found.</p>";
            return;
          }

          data.forEach((record) => {
            const mappedRecord = {
              rideId: record.rideId || "N/A",
              userId: record.passengerId || "Unknown User",
              action: `Pickup: ${record.pickupLocation || "N/A"}`,
              description: `Dropoff: ${record.dropoffLocation || "N/A"} | Fare: ₱${record.fare || 0}`,
              timestamp: `${record.date || ""} ${record.time || ""}`,
              status: record.status || "pending"
            };

            const card = document.createElement("div");
            card.classList.add("ride-card");

            card.innerHTML = `
              <div class="ride-header ${mappedRecord.status === "completed" ? "with-button" : ""}">
                <div class="ride-left">
                  <div class="ride-icon">
                    <img src="images/car.png" alt="ride icon">
                  </div>
                  <div class="ride-info">
                    <h2>Ride ID: ${mappedRecord.rideId}</h2>
                    <p><img src="images/person-icon.png" class="user-icon"> ${mappedRecord.userId}</p>
                  </div>
                </div>
                ${mappedRecord.status === "completed" ? '<button class="rate-btn">Rate</button>' : ''}
              </div>

              <div class="ride-route">
                <div class="route-line">
                  <div class="dot"></div>
                  <div class="line"></div>
                  <div class="dot"></div>
                </div>
                <div class="route-details">
                  <div>
                    <p class="label">Action</p>
                    <p class="place">${mappedRecord.action}</p>
                  </div>
                  <div>
                    <p class="label">Description</p>
                    <p class="place">${mappedRecord.description}</p>
                  </div>
                </div>
              </div>

              <div class="ride-footer">
                <div class="info-box">
                  <div class="icon"><img src="images/calendar.png"></div>
                  <p class="label">Timestamp</p>
                  <p class="value">${mappedRecord.timestamp}</p>
                </div>
                <div class="info-box">
                  <div class="icon"><img src="images/status.png"></div>
                  <p class="label">Status</p>
                  <p class="value">${mappedRecord.status}</p>
                </div>
              </div>
            `;

            container.appendChild(card);
          });
        })
        .catch((error) => {
          console.error("Error loading history records:", error);
          container.innerHTML = "<p>Failed to load history records.</p>";
        });
    });
  </script>
</body>

</html>
