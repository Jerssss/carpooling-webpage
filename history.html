<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARMA | History</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/notifications.css">
  <script src="js/script.js" defer></script>
  <script src="js/notifications.js" defer></script>
</head>

<body>
  <nav>
    <!-- Left side nav -->
    <div class="nav-left">
      <img src="images/carma-logo.png" class="logo" alt="Drop N Go Logo">
      <span class="site-name">CARMA</span>
    </div>

    <!-- Center navigation links -->
    <ul>
      <li><a class="active" href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

    <!-- Right side nav -->
    <div class="nav-right">
      <!-- Hamburger Menu -->
      <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="nav-bell">
        <img src="images/bell.png" class="bell-icon" onclick="toggleNotifications()">
        <div id="notificationsContainer">
          <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notif-tabs">
              <span class="active" id="allTab">All</span>
              <span id="unreadTab">Unread</span>
            </div>
            <div class="notif-list" id="notifList">
              <div class="notif-item">
                <div class="notif-content">
                  <p>Loading notifications...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <img src="images/speed.jpg" class="user-pic" onclick="toggleMenu()">
    </div>

    <!-- Profile dropdown -->
    <div class="sub-menu-wrap" id="subMenu">
      <div class="sub-menu">
        <div class="user-info">
          <img src="images/speed.jpg">
          <h2 id="userName">Loading...</h2>
        </div>
        <hr>
        <a href="profile.html" class="sub-menu-link">
          <img src="images/user.png" alt="usericon">
          <p>Edit Profile</p>
          <span>></span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="images/settings.png" alt="settings">
          <p>Settings</p>
          <span>></span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="images/question.png" alt="helpsicon">
          <p>Help & Support</p>
          <span>></span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="images/user-logout.png" alt="userlogouticon">
          <p>Logout</p>
          <span>></span>
        </a>
      </div>
    </div>
  </nav>

  <main>
    <section class="booked-rides">
      <h2>Your Rides</h2>
      <div id="rideHistoryContainer" class="ride-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="social-icons">
      <a href="#"><img src="images/facebook-app-symbol.png" alt="Facebook"></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="images/google.png" alt="Google"></a>
      <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">Our Team</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
  </footer>

  <!-- Report Modal -->
  <div id="reportModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="closeReportModal" class="close">&times;</span>
      <h3>Report a Problem</h3>
      <textarea id="reportText" placeholder="Describe your issue..." rows="5"></textarea>
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <button id="cancelReport">Cancel</button>
        <button id="submitReport">Submit</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="notification" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #28a745;
    color: #fff;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    display: none;
    z-index: 1000;
  "></div>

  <style>
  .modal {
    position: fixed;
    z-index: 999;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    width: 400px;
    max-width: 90%;
    text-align: center;
    position: relative;
  }

  .close {
    position: absolute;
    top: 10px; right: 15px;
    font-size: 24px;
    cursor: pointer;
  }

  #reportText {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    resize: none;
  }

  #submitReport, #cancelReport {
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    border: none;
  }

  #submitReport {
    background-color: #f0c419; /* yellow */
    color: #000;
  }

  #submitReport:hover {
    background-color: #e6b800;
  }

  #cancelReport {
    background-color: #ccc;
  }

  #cancelReport:hover {
    background-color: #aaa;
  }
  </style>

  <script>
  // Toast notification function
  function showNotification(message, color = "#28a745") {
    const notif = document.getElementById("notification");
    notif.style.backgroundColor = color;
    notif.innerText = message;
    notif.style.display = "block";
    setTimeout(() => notif.style.display = "none", 3000);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const container = document.getElementById("rideHistoryContainer");
    const modal = document.getElementById("reportModal");
    const closeModal = document.getElementById("closeReportModal");
    const submitReport = document.getElementById("submitReport");
    const cancelReport = document.getElementById("cancelReport");
    const reportText = document.getElementById("reportText");
    let selectedHistoryId = null;

    try {
      const response = await fetch("includes/fetch_history.php");
      const rides = await response.json();

      if (!rides || rides.length === 0) {
        container.innerHTML = "<p>No rides found.</p>";
        return;
      }

      rides.forEach(ride => {
        const rideCard = document.createElement("div");
        rideCard.classList.add("ride-card");

        let starsHTML = "";
        for (let i = 1; i <= 5; i++) {
          const selected = i <= (ride.rating || 0) ? "selected" : "";
          starsHTML += `<span class="star ${selected}" data-value="${i}" data-historyid="${ride.historyId}">&#9733;</span>`;
        }

        rideCard.innerHTML = `
          <div class="ride-header">
            <div class="ride-left">
              <div class="ride-icon">
                <img src="images/car.png" alt="Car Icon">
              </div>
              <div class="ride-info">
                <h2>${ride.carModel}</h2>
                <p><img src="images/person-icon.png" class="user-icon" alt="Driver"> ${ride.name}</p>
              </div>
            </div>
          </div>

          <div class="ride-route">
            <div class="route-line">
              <div class="dot"></div>
              <div class="line"></div>
              <div class="dot"></div>
            </div>
            <div class="route-details">
              <div class="pickup">
                <p class="label">PICKUP</p>
                <p class="place">${ride.pickup}</p>
              </div>
              <div class="dropoff">
                <p class="label">DROPOFF</p>
                <p class="place">${ride.dropoff}</p>
              </div>
            </div>
          </div>

          <div class="ride-footer">
            <div class="info-box">
              <div class="icon"><img src="images/calendar-icon.png" alt="Date"></div>
              <p class="label">Date</p>
              <p class="value">${ride.date}</p>
            </div>
            <div class="info-box">
              <div class="icon"><img src="images/clock-icon.png" alt="Time"></div>
              <p class="label">Time</p>
              <p class="value">${ride.time}</p>
            </div>
            <div class="info-box">
              <div class="icon"><img src="images/distance-icon.png" alt="Distance"></div>
              <p class="label">Distance</p>
              <p class="value">${ride.distance} km</p>
            </div>
            <div class="info-box">
              <div class="icon"><img src="images/fare.png" alt="Fare"></div>
              <p class="label">Fare</p>
              <p class="value">₱${ride.fare}</p>
            </div>
          </div>

          <div class="ride-actions">
            <div class="rating">${starsHTML}</div>
            <div class="report-btn action-btn">
              <img src="images/report-gray.png" alt="Report" title="Report Ride">
            </div>
          </div>
        `;

        container.appendChild(rideCard);
      });

      // Star rating interactivity
      container.addEventListener("click", async (e) => {
        if (!e.target.classList.contains("star")) return;

        const star = e.target;
        const value = parseInt(star.dataset.value);
        const historyId = star.dataset.historyid;
        const stars = star.parentNode.querySelectorAll(".star");

        stars.forEach(s => s.classList.toggle("selected", parseInt(s.dataset.value) <= value));

        await fetch("includes/fetch_history.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ historyId, rating: value })
        });

        showNotification(`You successfully rated this ride ${value} ${value === 1 ? "star" : "stars"}`);
      });

      // Report button functionality
      container.addEventListener("click", e => {
        const reportBtn = e.target.closest(".report-btn");
        if (!reportBtn) return;

        const card = reportBtn.closest(".ride-card");
        selectedHistoryId = card.querySelector(".star")?.dataset.historyid;
        reportText.value = "";
        modal.style.display = "flex";
      });

      // Close modal
      closeModal.onclick = () => modal.style.display = "none";
      cancelReport.onclick = () => modal.style.display = "none";
      window.onclick = e => { if (e.target == modal) modal.style.display = "none"; };

      // Submit report
      submitReport.onclick = async () => {
        const description = reportText.value.trim();
        if (!description) return alert("Please enter a description.");

        try {
          const response = await fetch("includes/fetch_history.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ historyId: selectedHistoryId, report_description: description })
          });
          const result = await response.json();
          if (result.success) {
            showNotification("You have successfully submitted your concern.");
            modal.style.display = "none";
          } else {
            showNotification("Failed to submit report.", "#dc3545");
          }
        } catch (err) {
          console.error(err);
          showNotification("Error submitting report.", "#dc3545");
        }
      };

    } catch (err) {
      console.error("Error loading rides:", err);
      container.innerHTML = "<p>Failed to load ride history.</p>";
    }
  });
  </script>
</body>
</html>
