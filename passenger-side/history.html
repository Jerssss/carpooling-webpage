<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARMA | History</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="../css/notifications.css">

  <script src="js/script.js" defer></script>
  <script src="../js/notifications.js" defer></script>
  <script src="js/fetch_history.js" defer></script>
</head>

<body>
  <nav>
    <div class="nav-left">
      <img src="../images/carma-logo.png" class="logo" alt="Logo">
      <span class="site-name">CARMA</span>
    </div>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a class="active" href="history.html">History</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

    <div class="nav-right">
      <div class="hamburger" id="hamburger">
        <div></div><div></div><div></div>
      </div>

      <div class="nav-bell">
        <img src="../images/bell.png" class="bell-icon" alt="Notifications">
        <div id="notificationsContainer">
          <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notif-tabs">
              <span class="active" id="allTab">All</span>
              <span id="unreadTab">Unread</span>
            </div>
            <div class="notif-list" id="notifList">
              <div class="notif-item">
                <div class="notif-content">
                  <p>Loading notifications...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <img src="../images/speed.jpg" class="user-pic" alt="User" onclick="toggleMenu()">
    </div>

    <div class="sub-menu-wrap" id="subMenu">
      <div class="sub-menu">
        <div class="user-info">
          <img src="../images/speed.jpg" alt="User">
          <h2 id="userName">Loading...</h2>
        </div>
        <hr>
        <a href="profile.html" class="sub-menu-link">
          <img src="../images/user.png" alt="usericon">
          <p>Edit Profile</p><span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/settings.png"><p>Settings</p><span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/question.png"><p>Help & Support</p><span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/user-logout.png"><p>Logout</p><span>&gt;</span>
        </a>
      </div>
    </div>
  </nav>

  <main>
    <section class="booked-rides">
      <h2>Your Rides</h2>

      <div class="ride-controls">
        <div class="search-bar">
          <img src="../images/search-icon.png">
          <input type="text" placeholder="Search rides...">
        </div>

        <div class="filter-dropdown">
          <img src="../images/filter-icon.png">
          <select>
            <option value="">All Cars</option>
            <option value="sedan">Sedan</option>
            <option value="suv">SUV</option>
            <option value="van">Van</option>
          </select>
        </div>
      </div>

      <!-- Upcoming Rides -->
      <h3 class="ride-section-title">Upcoming Rides</h3>
      <div id="upcomingRidesContainer" class="ride-list"></div>

      <!-- Finished Rides -->
      <h3 class="ride-section-title">Finished Rides</h3>
      <div id="finishedRidesContainer" class="ride-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="social-icons">
      <a><img src="../images/facebook-app-symbol.png"></a>
      <a><img src="../images/instagram.png"></a>
      <a><img src="../images/twitter.png"></a>
      <a><img src="../images/google.png"></a>
      <a><img src="../images/youtube.png"></a>
    </div>

    <ul class="footer-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">Our Team</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
  </footer>

</body>
</html>
