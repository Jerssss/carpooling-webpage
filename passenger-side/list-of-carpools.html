<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARMA | List of Carpools </title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="css/list-of-carpools.css">
  <script src="js/script.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/search_filter.js" defer></script>
  <script src="js/location-map.js" defer></script>
</head>

<body>
  <nav>
    <!-- Left side nav -->
    <div class="nav-left">
      <img src="../images/carma-logo.png" class="logo" alt="Carma">
      <span class="site-name">CARMA</span>
    </div>

    <!-- Center navigation links -->
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a class="active" href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

    <!-- Right side nav -->
    <div class="nav-right">
      <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="nav-bell">
        <img src="../images/bell.png" class="bell-icon" alt="Notifications" onclick="toggleNotifications()">
        <div id="notificationsContainer">
          <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notif-tabs">
              <span class="active" id="allTab">All</span>
              <span id="unreadTab">Unread</span>
            </div>
            <div class="notif-list" id="notifList">
              <div class="notif-item">
                <div class="notif-content">
                  <p>Loading notifications...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <img src="../images/speed.jpg" class="user-pic" alt="User" onclick="toggleMenu()">
    </div>

    <!-- Profile dropdown -->
    <div class="sub-menu-wrap" id="subMenu">
      <div class="sub-menu">
        <div class="user-info">
          <img src="../images/speed.jpg" alt="User">
          <h2 id="userName">Loading...</h2>
        </div>
        <hr>
        <a href="profile.html" class="sub-menu-link">
          <img src="../images/user.png" alt="usericon">
          <p>Edit Profile</p>
          <span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/settings.png" alt="settings">
          <p>Settings</p>
          <span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/question.png" alt="helpsicon">
          <p>Help &amp; Support</p>
          <span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/user-logout.png" alt="userlogouticon">
          <p>Logout</p>
          <span>&gt;</span>
        </a>
      </div>
    </div>
  </nav>

  <section class="carpool-section">
    <h1>List of Carpools in Your Area</h1>

    <div class="search-filter">
      <input type="text" id="searchInput" placeholder="Destination or Driver">

      <div class="filter-group">
        <select id="forFilter">
          <option value="">All Types</option>
          <option value="pickup">Pickup</option>
          <option value="meetup">Meetup</option>
        </select>

        <select id="seatsFilter">
          <option value="">All Seats</option>
          <option value="1">1 seat available</option>
          <option value="2">2 seats available</option>
          <option value="3">3 seats available</option>
        </select>

        <select id="roleFilter">
          <option value="">All Roles</option>
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>
    </div>

    <div class="cards-container">
      <div class="carpool-container">
        <!-- Dynamic cards injected here -->
      </div>
    </div>
  </section>

  <!-- Map Modal for viewing a single location pin -->
  <div id="locationMapModal" class="map-modal" aria-hidden="true">
    <div class="map-dialog" role="dialog" aria-modal="true" aria-labelledby="locationMapTitle">
      <div class="map-header">
        <h3 id="locationMapTitle">Location</h3>
        <button id="closeLocationMap" class="map-close" aria-label="Close">×</button>
      </div>
      <div id="locationMap" class="map-body" aria-hidden="true"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="social-icons">
      <a href="#"><img src="../images/facebook-app-symbol.png" alt="Facebook"></a>
      <a href="#"><img src="../images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="../images/twitter.png" alt="Twitter"></a>
      <a href="#"><img src="../images/google.png" alt="Google"></a>
      <a href="#"><img src="../images/youtube.png" alt="YouTube"></a>
    </div>

    <ul class="footer-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">Our Team</a></li>
    </ul>

    <p class="footer-copy">Copyright ©2025 | Designed by <span>Carma</span></p>
  </footer>
</body>

</html>
