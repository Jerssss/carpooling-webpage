<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARMA | Profile</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <script src="js/script.js" defer></script>
    <script src="../js/notifications.js" defer></script>
    <script src="../js/header-ui-loader.js" defer></script>
    <script src="js/profile.js" defer></script>
  </head>
  <body>
    <nav>
    <!-- Left side nav -->
    <div class="nav-left">
      <img src="../images/carma-logo.png" class="logo" alt="Drop N Go Logo">
      <span class="site-name">CARMA</span>
    </div>

    <!-- Center navigation links -->
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="list-of-carpools.html">Rides</a></li>
      <li><a href="history.html">History</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>

    <!-- Right side nav -->
    <div class="nav-right">
      <!-- Hamburger Menu -->
      <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="nav-bell">
        <img src="../images/bell.png" class="bell-icon" alt="Notifications" onclick="toggleNotifications()">
        <div id="notificationsContainer"></div>
      </div>

      <img src="../images/profile_pics/default-pic.png" class="user-pic" alt="User" onclick="toggleMenu()">
    </div>

    <!-- Profile dropdown -->
    <div class="sub-menu-wrap" id="subMenu">
      <div class="sub-menu">
        <div class="user-info">
          <img src="../images/profile_pics/default-pic.png" class="user-pic" alt="User">
          <h2 id="userName">Loading...</h2>
        </div>
        <hr>
        <a href="profile.html" class="sub-menu-link">
          <img src="../images/user.png" alt="usericon">
          <p>Edit Profile</p>
          <span>&gt;</span>
        </a>
        <a href="#" class="sub-menu-link">
          <img src="../images/user-logout.png" alt="userlogouticon">
          <p>Logout</p>
          <span>&gt;</span>
        </a>
      </div>
    </div>
  </nav>

    <section class="profile-page">
  <div class="profile-container">

    <div class="profile-header">
      <div class="user-basic">
        <img id="profilePic"
             src="../images/profile_pics/default-pic.png"
             class="profile-photo">
        <div>
          <h2 id="displayName">Loading...</h2>
          <p id="displayEmail">Loading...</p>
        </div>
      </div>

      <!-- SINGLE BUTTON -->
      <button id="editBtn" class="edit-btn" type="button">Edit</button>
    </div>

    <form id="profileForm" class="profile-form">

      <div class="form-group">
        <label>User ID</label>
        <input type="text" id="userID">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email">
      </div>

      <div class="form-group">
        <label>Roles</label>
        <input type="text" id="roles">
      </div>

      <div class="form-group">
        <label>Verified</label>
        <input type="text" id="isVerified">
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name">
      </div>

      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" id="phoneNo">
      </div>

      <div class="form-group">
        <label>Occupation</label>
        <input type="text" id="occupation">
      </div>

    </form>

  </div>
</section>
  </body>
</html>
